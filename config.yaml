# ============================================================
# OBWX 项目配置文件
# ============================================================

# ============================================================
# 数据集配置
# ============================================================
dataset:
  name: "OBWX"
  version: "v1.0"

# ============================================================
# 数据路径配置
# ============================================================
data:
  raw_root: "./data/obwx_raw"
  processed_root: "./data/obwx_processed"

# ============================================================
# 输出路径配置
# ============================================================
output:
  model_save_path: "./output/models"
  results_path: "./output/results"
  logs_path: "./output/logs"
# ============================================================
# 训练参数配置
# ============================================================
training:
  batch_size: 64
  epochs: 80
  num_workers: 0
  pin_memory: true

# ============================================================
# 优化器配置（支持分层学习率）
# ============================================================
optimizer:
  type: "AdamW"
  lr: 0.0001
  weight_decay: 0.00001
  lr_scale_backbone: 0.1
  lr_scale_head: 1.0
  lr_scale_transformer: 0.5
  lr_scale_cnn: 0.1

# ============================================================
# 数据增强配置
# ============================================================
augmentation:
  train:
    image_size: 224
    horizontal_flip_prob: 0.0
    rotation_limit: 5
    rotation_prob: 0.3
    brightness_limit: 0.1
    contrast_limit: 0.1
    brightness_prob: 0.3
  val:
    image_size: 224

# ============================================================
# 数据集划分配置
# ============================================================
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  min_images_per_class: 15
  max_images_per_class: 20

# ============================================================
# 全局默认模型配置（各模型可单独覆盖）
# ============================================================
default_model_config:
  freeze_strategy: "frozen"
  hidden_dims: [512]
  dropout_rates: [0.2]
  activation: "relu"
  attention_dropout: 0.0

# ============================================================
# 模型专项配置
# ============================================================
models:
  # ---- CNN 模型 ----
  ResNet18:
    freeze_strategy: "full"          # 全量微调
    hidden_dims: [512]
    dropout_rates: [0.2]
    activation: "relu"

  EfficientNet-B3:
    freeze_strategy: "full"          # 全量微调
    hidden_dims: [1024, 512]
    dropout_rates: [0.3, 0.2]
    activation: "silu"

  DenseNet121:
    freeze_strategy: "frozen"
    hidden_dims: [1024, 512]
    dropout_rates: [0.4, 0.2]
    activation: "relu"
    attention_dropout: 0.0

  # ---- Transformer 模型 ----
  ViT-B/16:
    freeze_strategy: "frozen"
    hidden_dims: [1024, 512]
    dropout_rates: [0.3, 0.2]
    activation: "gelu"

  Swin Transformer:
    freeze_strategy: "frozen"
    hidden_dims: [1024, 512]
    dropout_rates: [0.3, 0.2]
    activation: "gelu"

  # ---- 现代 CNN 模型 ----
  ConvNeXt-Tiny:
    freeze_strategy: "frozen"
    hidden_dims: [512]
    dropout_rates: [0.2]
    activation: "gelu"

  EfficientNetV2-S:
    freeze_strategy: "frozen"
    hidden_dims: [512]
    dropout_rates: [0.2]
    activation: "gelu"

  MaxViT-T:
    freeze_strategy: "frozen"
    hidden_dims: [512]
    dropout_rates: [0.2]
    activation: "gelu"

  RegNetY-4GF:
    freeze_strategy: "frozen"
    hidden_dims: [512]
    dropout_rates: [0.2]
    activation: "gelu"

  # ---- 轻量级模型 ----
  MobileNetV3-Large:
    freeze_strategy: "full"          # 全量微调
    hidden_dims: [256]
    dropout_rates: [0.3]
    activation: "relu"

  ShuffleNetV2:
    freeze_strategy: "full"          # 全量微调
    hidden_dims: [256]
    dropout_rates: [0.3]
    activation: "relu"

  # ---- 混合模型 ----
  Hybrid-CNN-Transformer:
    cnn_backbone: "resnet18"
    transformer_dim: 512
    num_heads: 8
    num_layers: 2
    dropout: 0.1
    freeze_strategy: "frozen"
    use_cls_token: true
    pool_type: "cls"
    hidden_dims: [512]
    dropout_rates: [0.2]
    activation: "gelu"

  # ---- 新增现代架构（统一协议：224×224 / ImageNet 预训练 / batch_size=64 / epoch=80 / seed=42）----
  InceptionNeXt-Small:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  ConvNeXt-V2-Tiny:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  CoAtNet-Tiny:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  EfficientFormerV2-S:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  iFormer-S:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  # ---- 第二批新增架构（统一协议同上：224×224 / ImageNet 预训练 / batch_size=64 / epoch=80 / seed=42）----
  # 说明：MobileViT-V2 官方按宽度命名（无 S），此处 S 映射为 1.0（7.80M）；
  #       Swin-V2-Tiny 因 256 版在 224 输入下断言失败，使用 224 原生 checkpoint (swinv2_cr_tiny_224)。
  MobileViT-V2-S:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  Swin-V2-Tiny:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  RepViT-M1.1:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  # EdgeNeXt 用户写作 edgnext_*，timm 实际前缀为 edgenext_*（已修正）
  EdgeNeXt-Small-RW:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

  # 替代 CMT-Small：CMT 从未被 timm 收录（0.9.2/0.9.12/1.0.29/main 均无实现），
  # 改选 pvt_v2_b2（28.26M，金字塔+卷积下采样+SR 注意力，多尺度特性最接近）
  PVTv2-B2:
    freeze_strategy: "full"
    hidden_dims: [512, 256]
    dropout_rates: [0.2, 0.1]
    activation: "gelu"
    lr_scale_backbone: 1.0
    lr_scale_head: 1.0
    batch_size: 64

# ============================================================
# 训练额外配置
# ============================================================
random_seed: 42
device: "cuda"
use_layerwise_lr: true
best_val_threshold: 0.1
grad_clip_norm: 1.0
unfreeze_epoch: 3          # 第3轮解冻（比之前更早）
lr_reduce_factor: 0.5      # 解冻后学习率降为原来的一半（而非 0.1 倍）

# ============================================================
# 支持的图片扩展名
# ============================================================
image_extensions:
  - ".jpg"
  - ".jpeg"
  - ".png"
  # 注：匹配时用 f.lower().endswith(ext.lower())，因此只列小写即可覆盖
  # 任意大小写变体；此前重复列出 ".JPG"/".JPEG"/".PNG" 会导致同一文件被
  # 匹配两次（数据泄漏根因），已移除。